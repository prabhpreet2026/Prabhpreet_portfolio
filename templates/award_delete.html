{% extends 'sidebar.html' %}
{% block title %}Delete Award{% endblock %}
{% block page_title %}Delete Award{% endblock %}
{% block content %}
<div class="delete-box">
    <div class="delete-icon"><i class="fa-solid fa-trash"></i></div>
    <h2>Delete Award?</h2>
    <p>Are you sure you want to delete <strong>{{ award.title }}</strong>?</p>
    <form method="POST">
        {% csrf_token %}
        <div class="buttons">
            <a href="{% url 'awards' %}">Cancel</a>
            <button type="submit">Yes, Delete</button>
        </div>
    </form>
</div>
<style>
.delete-box{max-width:450px;margin:80px auto;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:40px;text-align:center}.delete-icon{width:60px;height:60px;margin:0 auto 20px;background:#fee2e2;color:#dc2626;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}.delete-box h2{color:#1e293b;margin-bottom:10px}.delete-box p{color:#64748b;font-size:13px;line-height:1.6}.buttons{display:flex;justify-content:center;gap:10px;margin-top:25px}.buttons a,.buttons button{padding:11px 18px;border:0;border-radius:8px;text-decoration:none;cursor:pointer;font-size:13px}.buttons a{background:#f1f5f9;color:#475569}.buttons button{background:#dc2626;color:#fff}
</style>
{% endblock %}
