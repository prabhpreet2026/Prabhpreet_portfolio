
{% extends 'sidebar.html' %}

{% block title %}Delete Training{% endblock %}

{% block content %}

<div class="delete-wrapper">
    <div class="delete-card">
        <div class="delete-icon">
            <i class="fa-solid fa-trash"></i>
        </div>

        <h2>Delete Training?</h2>

        <p>Are you sure you want to delete <strong>{{ training.title }}</strong>?</p>

        <p class="warning">This action cannot be undone.</p>

        <form method="POST">
            {% csrf_token %}

            <div class="delete-actions">
                <a href="{% url 'training' %}" class="cancel">Cancel</a>
                <button type="submit" class="confirm-delete">Yes, Delete</button>
            </div>
        </form>
    </div>
</div>

<style>
.delete-wrapper{min-height:60vh;display:flex;align-items:center;justify-content:center}
.delete-card{background:white;width:430px;padding:40px;border-radius:15px;text-align:center;border:1px solid #e5e7eb;box-shadow:0 10px 30px rgba(0,0,0,.05)}
.delete-icon{width:60px;height:60px;margin:auto auto 20px;border-radius:50%;background:#fee2e2;color:#dc2626;display:flex;align-items:center;justify-content:center;font-size:22px}
.delete-card h2{color:#1e293b;margin-bottom:10px}
.delete-card p{color:#64748b;font-size:13px;line-height:1.6}
.warning{color:#dc2626!important;margin-top:5px}
.delete-actions{display:flex;justify-content:center;gap:10px;margin-top:25px}
.cancel,.confirm-delete{padding:11px 18px;border-radius:8px;text-decoration:none;font-size:13px;border:none;cursor:pointer}
.cancel{background:#f1f5f9;color:#475569}
.cancel:hover{background:#e2e8f0}
.confirm-delete{background:#dc2626;color:white}
.confirm-delete:hover{background:#b91c1c}
@media(max-width:500px){
.delete-card{width:100%;margin:20px;padding:30px 20px}
}
</style>

{% endblock %}
```
